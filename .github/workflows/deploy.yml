name: Deploy to GitHub Pages

# Only trusted commits on main (or a manual run) build and deploy.
# There is deliberately no pull_request trigger: project builds execute npm scripts,
# so unreviewed code never runs with deployment credentials.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs opt in to what they need.
permissions:
  contents: read

# One deployment at a time; queued runs wait instead of cancelling an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build homepage and all projects
        # discover -> vite build -> build/copy projects -> validate dist/
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  readme:
    name: Update README project list
    # Runs only after a successful build, so broken projects never reach the README.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate project list
        run: node scripts/update-readme.mjs

      - name: Commit changes (if any)
        # Pushes made with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop.
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update project list in README"
          git pull --rebase origin main
          git push origin HEAD:main
