<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunter Pet Training Guide</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#65707b; --line:#e2ddd2;
  --accent:#b4531a; --accent-soft:#f7e6d9; --good:#2c7a4b; --good-soft:#e1f2e8;
  --warn:#9a6a00; --warn-soft:#fbf0d2; --chip:#eee9de;
  --sE:#1a5fb4; --sK:#b3261e; --sZ:#7b3fb0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2327; --ink:#e8e6e1; --muted:#9aa4ae; --line:#323840;
    --accent:#e88a4f; --accent-soft:#3a2a1f; --good:#6fcf97; --good-soft:#1d3327;
    --warn:#e6b84d; --warn-soft:#38301a; --chip:#2a2f35;
    --sE:#7db3f5; --sK:#f28b82; --sZ:#c9a0f0;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2327; --ink:#e8e6e1; --muted:#9aa4ae; --line:#323840;
  --accent:#e88a4f; --accent-soft:#3a2a1f; --good:#6fcf97; --good-soft:#1d3327;
  --warn:#e6b84d; --warn-soft:#38301a; --chip:#2a2f35;
  --sE:#7db3f5; --sK:#f28b82; --sZ:#c9a0f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:26px;margin:0 0 2px}
.sub{color:var(--muted);margin:0}
h2{font-size:19px;margin:26px 0 10px}
h3{font-size:16px;margin:0 0 6px}
button,.tab,select,input{font:inherit}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
select,input[type=number],input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=number]{width:80px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--chip);color:var(--ink);padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
.tab{background:var(--chip);border:1px solid transparent;color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
section.panel{display:none}
section.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;margin:12px 0}
.tip{background:var(--good-soft);border-left:4px solid var(--good);padding:10px 14px;border-radius:8px;margin:12px 0}
ul{margin:6px 0;padding-left:20px}
ul.plain{list-style:none;padding-left:0}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;margin-right:6px;white-space:nowrap}
.stop{border-left:5px solid var(--accent)}
.stop h3 span{color:var(--muted);font-weight:400;font-size:14px}
.stop li{margin:10px 0}
label.ck{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
label.ck input{margin-top:4px;width:17px;height:17px;flex:none}
label.ck input:checked + span .pet{opacity:.55}
label.ck input:checked + span .pill{text-decoration:line-through;opacity:.6}
a.pet{font-weight:600;text-decoration:none;border-bottom:1px dotted currentColor}
a.pet:hover{border-bottom-style:solid}
a.pet.s-E{color:var(--sE)} a.pet.s-K{color:var(--sK)} a.pet.s-Z{color:var(--sZ)}
small{color:var(--muted)}
.two{color:var(--accent)}
.pets{display:block;margin-top:2px}
.p{display:block;margin:2px 0}
details.alt{margin:4px 0 0 26px;border-top:1px dashed var(--line);padding-top:4px}
details.alt summary,details.divd summary{cursor:pointer;color:var(--muted);font-size:13px}
details.alt .p{font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0}
.small{font-size:13px;color:var(--muted)}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
.rk-card h4{margin:0 0 6px;font-size:15px}
.rk-card h4 small{font-weight:400}
details.divd{margin-top:10px;border-top:2px dashed var(--line);padding-top:6px}
details.divd summary{font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grp{margin:6px 0 2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.legend span{margin-right:14px;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
.fcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fcard b{display:block;font-size:16px}
.spd{display:inline-block;min-width:44px;font-weight:700}
@media (max-width:600px){ h1{font-size:22px} details.alt{margin-left:0} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="title">🐾 Hunter Pet Training Guide</h1>
    <p class="sub" id="subtitle"></p>
  </div>
  <button class="btn" id="theme" aria-label="Toggle theme">Theme</button>
</header>

<div class="ctl">
  <label><b>Pet family:</b> <select id="fam"></select></label>
  <span><b>Continent:</b></span>
  <span class="seg" id="fac"><button data-f="E">Eastern Kingdoms</button><button data-f="K">Kalimdor</button></span>
  <label><input type="checkbox" id="zep"> Zephras Isle available <small>(Sky Elf start)</small></label>
</div>
<div class="legend small"><span><i class="dot" style="background:var(--sE)"></i>Eastern Kingdoms</span><span><i class="dot" style="background:var(--sK)"></i>Kalimdor</span><span><i class="dot" style="background:var(--sZ)"></i>Zephras Isle</span></div>

<nav role="tablist" id="tabs">
  <button class="tab" role="tab" data-p="rules">Overview</button>
  <button class="tab" role="tab" data-p="planA">Plan A: every trip</button>
  <button class="tab" role="tab" data-p="planB">Plan B: every 10 levels</button>
  <button class="tab" role="tab" data-p="speed">Attack speed</button>
  <button class="tab" role="tab" data-p="ranks">All ranks</button>
  <button class="tab" role="tab" data-p="fams">All families</button>
  <button class="tab" role="tab" data-p="more">Quirks &amp; TP</button>
</nav>

<section class="panel" id="rules"></section>
<section class="panel" id="planA"></section>
<section class="panel" id="planB"></section>
<section class="panel" id="speed"></section>
<section class="panel" id="ranks"></section>
<section class="panel" id="fams"></section>
<section class="panel" id="more"></section>
</div>

var PASSIVE=['arcaneresistance','fireresistance','frostresistance','greatstamina','naturalarmor','natureresistance','shadowresistance'];
var AB=DB.ab, PETS=DB.pets;
var st={fam:'cat',fac:'E',zep:true,lvl:0,tab:'rules'};
function sg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var root=document.documentElement;

function opp(){return st.fac==='E'?'K':'E'}
function oppName(){return st.fac==='E'?'Kalimdor':'Eastern Kingdoms'}
function myName(){return st.fac==='E'?'Eastern Kingdoms':'Kalimdor'}
function fam(){return DB.fams[st.fam]}
function learnable(s,f){return AB[s].all||AB[s].fams.indexOf(f)>-1}
function actives(f){return Object.keys(AB).filter(function(s){return learnable(s,f)&&PASSIVE.indexOf(s)<0}).sort(function(a,b){return AB[a].n.localeCompare(AB[b].n)})}
function passives(f){return PASSIVE.filter(function(s){return AB[s]&&learnable(s,f)})}
function rks(s){return Object.keys(AB[s].ranks).map(Number).sort(function(a,b){return a-b})}
function lowL(id){return parseInt(PETS[id].l,10)||1}
function inCont(id){var s=PETS[id].s;return s==='Z'?st.zep:s===st.fac}
function anyVis(id){return PETS[id].s!=='Z'||st.zep}

var ALSO={};
Object.keys(AB).forEach(function(s){Object.keys(AB[s].ranks).forEach(function(r){AB[s].ranks[r].ids.forEach(function(id){(ALSO[id]=ALSO[id]||[]).push([s,+r])})})});
function alsoList(id,cur,f,maxPl){
  return (ALSO[id]||[]).filter(function(x){
    if(cur&&x[0]===cur[0]&&x[1]===cur[1])return false;
    if(!learnable(x[0],f))return false;
    if(maxPl!=null&&AB[x[0]].ranks[x[1]].pl>maxPl)return false;
    return true;});
}
function pet(id,cur,wording,hideAlso){
  var p=PETS[id];
  var also=hideAlso?[]:alsoList(id,cur,st.fam).map(function(x){return AB[x[0]].n+' '+x[1]});
  return '<a class="pet s-'+p.s+'" href="https://www.wowhead.com/forever/npc='+id+'" target="_blank" rel="noopener">'+esc(p.n)+'</a> <small>'+esc(p.f)+' '+esc(p.l)+' · '+esc(p.z)+(also.length?' · <b class="two">'+(wording||'also')+' '+esc(also.join(', '))+'</b>':'')+'</small>';
}
function pl(ids,cur){return ids.map(function(id){return '<span class="p">'+pet(id,cur)+'</span>'}).join('')}

function renderRules(){
  var F=fam(),f=st.fam,acts=actives(f);
  var h='<h2>'+esc(F.n)+'</h2><div class="card"><p><b>Diet:</b> '+esc(F.diet||'unknown')+'</p>';
  h+='<p><b>Trainable abilities:</b> '+acts.map(function(s){var top=rks(s).pop();return esc(AB[s].n)+' <small>('+top+' rank'+(top>1?'s':'')+')</small>'}).join(', ')+(F.extra?', '+F.extra.map(esc).join(', ')+' <small>(listed on Petopia\'s family page, no rank data)</small>':'')+'</p>';
  h+='<p><b>Passive (trainer) skills:</b> '+passives(f).map(function(s){return esc(AB[s].n)}).join(', ')+'</p>';
  if(F.notes) h+='<p class="small"><b>Petopia notes:</b> '+esc(F.notes)+'</p>';
  h+='</div>';
  // multi-skill pets
  var best=[];
  Object.keys(ALSO).forEach(function(id){
    if(!inCont(id))return;
    var slugs={};
    ALSO[id].forEach(function(x){if(PASSIVE.indexOf(x[0])<0&&learnable(x[0],f))slugs[x[0]]=1});
    var n=Object.keys(slugs).length;
    if(n>=2)best.push([n,id]);
  });
  best.sort(function(a,b){return b[0]-a[0]||lowL(a[1])-lowL(b[1])});
  h+='<div class="tip"><b>Multi-skill pets for '+esc(F.n)+' in '+esc(myName())+(st.zep?' and Zephras Isle':'')+'</b> <small>(one tame teaches several of this family\'s skills)</small>';
  if(best.length) h+='<ul class="plain">'+best.slice(0,12).map(function(b){return '<li>'+pet(b[1],null,'teaches')+'</li>'}).join('')+'</ul>';
  else h+='<p class="small">None on this continent.</p>';
  h+='</div>';
  h+='<h2>How it works</h2><div class="card"><ul>'+
  '<li>You can tame a pet only if it is <b>at or below your level</b>.</li>'+
  '<li>Your permanent pet must be <b>at or above the "pet lvl"</b> of a rank before you can teach it (the pet\'s level, not yours).</li>'+
  '<li><b>Skipping ranks is fine</b>, and upgrading refunds the TP of the lower rank, so jumping straight to a higher rank costs the same total as going rank by rank.</li>'+
  '<li><b>Growl</b>, <b>resistances</b>, <b>Great Stamina</b> and <b>Natural Armor</b> are bought from the pet trainer, not tamed.</li>'+
  '<li>Level ranges like "40–41" mean the one you find might be a level above you. Tame a neighbour or gain a level.</li>'+
  '<li>Every pet name links to its Wowhead Forever page, where you can see its spawn locations.</li>'+
  '<li>The plans are generated from Petopia\'s data for whichever family you pick. They are a starting point, not hand-tuned.</li></ul></div>'+
  '<div class="note">Viewing <b>'+myName()+'</b> with Zephras Isle pets '+(st.zep?'included':'hidden')+'. Pets in <b>'+oppName()+'</b> are not left out: each step has a "'+oppName()+'" divider you can open. If a rank has no source on your continent, the step says so and opens the divider for you.</div>'+
  '<p class="small">Tick boxes are saved in this browser, per family and continent. Data source: wow-petopia.com/forever.</p>';
  document.getElementById('rules').innerHTML=h;
}

/* ---------- PLAN BUILDING ---------- */
var THR=[16,24,32,40,48,56];
function bucket(g){return THR.filter(function(t){return g>=t}).length}
function petG(id,R){return Math.max(10,R.pl,lowL(id))}
function sortOwnA(ids,s,r){
  var R=AB[s].ranks[r];
  return ids.slice().sort(function(a,b){
    var ba=bucket(petG(a,R)),bb=bucket(petG(b,R));
    if(ba!==bb)return ba-bb;
    var ca=alsoList(a,[s,r],st.fam).length,cb=alsoList(b,[s,r],st.fam).length;
    if(ca!==cb)return cb-ca;
    return lowL(a)-lowL(b);
  });
}
function buildA(){
  var f=st.fam,rows=[];
  actives(f).forEach(function(s){rks(s).forEach(function(r){
    var R=AB[s].ranks[r];
    if(R.src==='N')return;
    var own=[],alt=[];
    if(R.src==='P'){own=R.ids.filter(inCont);alt=R.ids.filter(function(id){return PETS[id].s===opp()});}
    var pool=own.length?own:alt,g=Math.max(10,R.pl);
    if(R.src==='P'){ if(!pool.length)return; g=Math.max(g,Math.min.apply(null,pool.map(lowL))); }
    rows.push({s:s,r:r,R:R,g:g,own:sortOwnA(own,s,r),alt:alt,b:bucket(g)});
  })});
  var best={};
  rows.forEach(function(x){var k=x.b+'|'+x.s;if(!best[k]||x.r>best[k].r)best[k]=x});
  var by={};
  Object.keys(best).forEach(function(k){var x=best[k];(by[x.b]=by[x.b]||[]).push(x)});
  var stops=[];
  Object.keys(by).map(Number).sort(function(a,b){return a-b}).forEach(function(b,i){
    var xs=by[b].sort(function(a,c){return a.g-c.g||AB[a.s].n.localeCompare(AB[c.s].n)});
    var lo=xs[0].g,hi=xs[xs.length-1].g;
    stops.push({title:'Trip '+(i+1)+' · Level '+(lo===hi?lo:lo+'–'+hi),items:xs});
  });
  return stops;
}
function buildB(){
  var f=st.fam,acts=actives(f),prev={},stops=[];
  for(var V=10,n=0;V<=60;V+=10){
    var items=[];
    acts.forEach(function(s){
      var ks=rks(s).filter(function(r){return r>(prev[s]||0)&&AB[s].ranks[r].pl<=V}).reverse();
      for(var i=0;i<ks.length;i++){
        var r=ks[i],R=AB[s].ranks[r];
        if(R.src==='N')continue;
        if(R.src==='T'){items.push({s:s,r:r,R:R,own:[],alt:[],g:V});prev[s]=r;break}
        var any=R.ids.filter(function(id){return anyVis(id)&&lowL(id)<=V});
        if(!any.length)continue;
        var own=any.filter(inCont).sort(function(a,b){
          var ca=alsoList(a,[s,r],f,V).length,cb=alsoList(b,[s,r],f,V).length;
          return cb-ca||lowL(b)-lowL(a)});
        var alt=R.ids.filter(function(id){return PETS[id].s===opp()}).sort(function(a,b){return lowL(a)-lowL(b)});
        items.push({s:s,r:r,R:R,own:own,alt:alt,g:V});prev[s]=r;break;
      }
    });
    if(items.length){n++;stops.push({title:'Visit '+n+' · Level '+V,items:items})}
  }
  return stops;
}
function itemHtml(plan,si,x){
  var cur=[x.s,x.r],R=x.R,k=plan+'-'+st.fam+'-'+st.fac+'-'+x.s+'-'+x.r;
  var meta='<small>pet lvl '+R.pl+(R.tp?' · '+R.tp+' TP':' · 0 TP')+(R.d?' · '+esc(R.d):'')+'</small>';
  var body,alt=x.alt||[];
  if(R.src==='T') body='<span class="pets"><span class="p"><small>Learned from the pet trainer (no taming).</small></span></span>';
  else{
    var show=x.own.slice(0,5),more=x.own.slice(5);
    body='<span class="pets">'+(show.length?pl(show,cur):'<span class="p"><small>No source in '+myName()+(alt.length?'. Open the '+oppName()+' list below.':'.')+'</small></span>')+'</span>';
    x.moreHtml=more.length?'<details class="alt"><summary>More in '+myName()+' ('+more.length+')</summary>'+pl(more,cur)+'</details>':'';
  }
  var h='<li><label class="ck"><input type="checkbox" data-k="'+k+'"><span><span class="pill">'+esc(AB[x.s].n)+' '+x.r+'</span>'+meta+body+'</span></label>';
  if(x.moreHtml)h+=x.moreHtml;
  if(alt.length)h+='<details class="alt"'+((R.src==='P'&&!x.own.length)?' open':'')+'><summary>'+oppName()+' ('+alt.length+')</summary>'+pl(alt,cur)+'</details>';
  return h+'</li>';
}
function zonesOf(items){
  var z=[];items.forEach(function(x){(x.own||[]).slice(0,5).forEach(function(id){var n=PETS[id].z.replace(' (Dungeon)','').replace(' (Raid)','');if(z.indexOf(n)<0)z.push(n)})});
  return z.slice(0,4).join(' · ');
}
function renderPlan(key,title,sub,stops){
  var h='<h2>'+title+' — '+esc(fam().n)+'</h2><div class="row"><span class="small">'+sub+'</span><button class="reset" data-reset="'+key+'">Clear ticks</button></div>';
  if(!stops.length)h+='<div class="note">No obtainable ranks found for this family with these settings.</div>';
  stops.forEach(function(stop,si){
    h+='<div class="card stop"><h3>'+esc(stop.title)+' <span>'+esc(zonesOf(stop.items))+'</span></h3><ul class="plain">'+stop.items.map(function(x){return itemHtml(key,si,x)}).join('')+'</ul></div>';
  });
  var ps=passives(st.fam);
  h+='<p class="small">Also from the pet trainer (see All ranks): '+ps.map(function(s){return esc(AB[s].n)}).join(', ')+'.</p>';
  document.getElementById(key).innerHTML=h;
}

/* ---------- ATTACK SPEED ---------- */
function renderSpeed(){
  var F=fam(),sing=DB.sing[st.fam],h='<h2>'+esc(F.n)+' by attack speed</h2>';
  h+='<div class="note">Attack speed does not change a pet\'s DPS: faster pets hit more often for proportionally less. It mostly matters in PvP and for interrupts. A pet keeps the speed of the creature you tame.</div>';
  h+='<div class="row"><label>Only pets up to level <input type="number" min="0" max="63" id="lvl" value="'+(st.lvl||'')+'" placeholder="any"></label><span class="small">tames your current level can take</span></div>';
  var speeds=Object.keys(DB.speed).sort(function(a,b){return parseFloat(a)-parseFloat(b)}),any=false;
  speeds.forEach(function(sp){
    var ids=DB.speed[sp].filter(function(id){return PETS[id].f===sing&&(!st.lvl||lowL(id)<=st.lvl)});
    if(!ids.length)return;
    any=true;
    ids.sort(function(a,b){return lowL(a)-lowL(b)});
    var own=ids.filter(inCont),other=ids.filter(function(id){return PETS[id].s===opp()});
    var base=sp==='2.0';
    h+='<div class="card rk-card"><details'+(base&&speeds.length>1?'':' open')+'><summary><b><span class="spd">'+sp+'</span></b> <small>'+ids.length+' pet'+(ids.length>1?'s':'')+(base?' (the default speed)':'')+'</small></summary>';
    if(own.length)h+='<div class="grp">'+myName()+(st.zep?' and Zephras Isle':'')+'</div>'+pl(own,null);
    if(other.length)h+='<details class="divd"><summary>'+oppName()+' ('+other.length+')</summary>'+pl(other,null)+'</details>';
    if(!own.length&&!other.length)h+='<p class="small">None.</p>';
    h+='</details></div>';
  });
  if(!any)h+='<div class="note">No '+esc(F.n)+' found with these settings.</div>';
  h+='<p class="small">Pets that also teach one of this family\'s skills show it in orange. Source: wow-petopia.com/forever/attackspeed.php.</p>';
  document.getElementById('speed').innerHTML=h;
  var inp=document.getElementById('lvl');
  inp.onchange=function(){st.lvl=parseInt(this.value,10)||0;ss('hpg-lvl',st.lvl);renderSpeed()};
}

/* ---------- ALL RANKS ---------- */
function renderRanks(){
  var f=st.fam,h='<h2>All ranks — '+esc(fam().n)+'</h2><div class="row"><input type="search" id="q" placeholder="Filter by pet, family or zone…"></div>';
  actives(f).forEach(function(s){
    var A=AB[s];
    h+='<h2>'+esc(A.n)+'</h2><p class="small">'+esc(A.desc)+'</p>';
    rks(s).forEach(function(r){
      var R=A.ranks[r],cur=[s,r];
      h+='<div class="card rk-card"><h4>'+esc(A.n)+' '+r+' <small>pet lvl '+R.pl+' · '+R.tp+' TP'+(R.d?' · '+esc(R.d):'')+'</small></h4>';
      if(R.src==='T')h+='<p class="small">Learned from the pet trainer.</p>';
      else if(R.src==='N')h+='<p class="small">No known training source (Petopia).</p>';
      else{
        var zep=R.ids.filter(function(i){return PETS[i].s==='Z'&&st.zep}),main=R.ids.filter(function(i){return PETS[i].s===st.fac}),other=R.ids.filter(function(i){return PETS[i].s===opp()});
        if(zep.length)h+='<div class="grp">Zephras Isle</div>'+pl(zep,cur);
        if(main.length)h+='<div class="grp">'+myName()+'</div>'+pl(main,cur);
        if(other.length)h+='<details class="divd" open><summary>'+oppName()+' ('+other.length+')</summary>'+pl(other,cur)+'</details>';
      }
      h+='</div>';
    });
  });
  var ps=passives(f);
  h+='<h2>Pet trainer passives</h2><div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Skill</th><th>Rank</th><th>Pet lvl</th><th>TP</th><th>Effect</th></tr></thead><tbody>';
  ps.forEach(function(s){rks(s).forEach(function(r){var R=AB[s].ranks[r];h+='<tr><td>'+esc(AB[s].n)+'</td><td>'+r+'</td><td>'+R.pl+'</td><td>'+R.tp+'</td><td>'+esc(R.d)+'</td></tr>'})});
  h+='</tbody></table></div></div>';
  document.getElementById('ranks').innerHTML=h;
  document.getElementById('q').oninput=function(){
    var q=this.value.toLowerCase();
    [].forEach.call(document.querySelectorAll('#ranks .rk-card'),function(c){
      var ps=c.querySelectorAll('.p');if(!ps.length)return;
      var any=false;
      [].forEach.call(ps,function(p){var m=!q||p.textContent.toLowerCase().indexOf(q)>-1;p.style.display=m?'':'none';if(m)any=true});
      c.style.display=(any||!q)?'':'none';
    });
  };
}

/* ---------- ALL FAMILIES ---------- */
function renderFams(){
  var h='<h2>All families</h2><p class="small">Click a family to switch the whole guide to it.</p><div class="fgrid">';
  Object.keys(DB.fams).sort(function(a,b){return DB.fams[a].n.localeCompare(DB.fams[b].n)}).forEach(function(id){
    var F=DB.fams[id];
    h+='<button class="fcard" data-fam="'+id+'" '+(id===st.fam?'aria-current="true"':'')+'><b>'+esc(F.n)+'</b><small>Diet: '+esc(F.diet||'?')+'</small><br>'+
       actives(id).map(function(s){return esc(AB[s].n)}).join(', ')+(F.extra?', '+F.extra.map(esc).join(', '):'')+'</button>';
  });
  h+='</div>';
  var el=document.getElementById('fams');el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('[data-fam]'),function(b){b.onclick=function(){setFam(b.dataset.fam);show('rules')}});
}

/* ---------- QUIRKS & TP ---------- */
function renderMore(){
  var f=st.fam,zs={E:[],K:[],Z:[]},seen={};
  Object.keys(PETS).forEach(function(id){var p=PETS[id];if(!seen[p.z]){seen[p.z]=1;zs[p.s].push(p.z)}});
  function zl(a){return a.sort().join(', ')}
  var tot=0,rows='';
  actives(f).forEach(function(s){var top=rks(s).filter(function(r){return AB[s].ranks[r].src!=='N'}).pop();if(top==null)return;var R=AB[s].ranks[top];tot+=R.tp;rows+='<li>'+esc(AB[s].n)+' '+top+': '+R.tp+' TP</li>'});
  var h='<h2>Training points: '+esc(fam().n)+' at max obtainable rank</h2><div class="card"><ul>'+rows+'</ul><p><b>Active skills total: '+tot+' TP</b></p>'+
  '<p class="small">Upgrading a rank refunds the lower rank, so only the final ranks count. I did not check how many TP a pet has at each level. Passive skills (see All ranks) cost extra TP.</p></div>'+
  '<h2>Data quirks</h2><div class="note"><ul>'+
  '<li>Cat Cower 4 lists <b>Savannah Patriarch</b> at level 14–16 (The Barrens) even though the rank needs pet level 35. Looks like a Petopia error.</li>'+
  '<li>Spider Dash 3 lists <b>Broodwidow</b> at level 16 (Ruins of Lordaeron). Don\'t rely on it.</li>'+
  '<li>Several abilities (Web, Pinch, Swipe, Dismember, Tendon Rip, Savage Rend, Dust Cloud, Demoralizing Screech, Lava Breath, Charge 2+, Lightning Breath 2+, Thunderstomp 2+) have ranks Petopia marks "no known training source". Plans skip those ranks.</li>'+
  '<li>Core Hounds are a family in Forever but Petopia found no tameable ones.</li>'+
  '<li>Petopia lists the zone for each pet, not the continent. The Eastern Kingdoms / Kalimdor sorting is mine, by zone (below). Check it if a zone surprises you.</li></ul></div>'+
  '<h2>How zones are sorted</h2><div class="card"><ul>'+
  '<li><b style="color:var(--sE)">Eastern Kingdoms:</b> '+zl(zs.E)+'</li>'+
  '<li><b style="color:var(--sK)">Kalimdor:</b> '+zl(zs.K)+'</li>'+
  '<li><b style="color:var(--sZ)">Zephras Isle:</b> '+zl(zs.Z)+' (toggle at the top)</li></ul></div>';
  document.getElementById('more').innerHTML=h;
}

/* ---------- wiring ---------- */
function bindChecks(){
  [].forEach.call(document.querySelectorAll('input[data-k]'),function(c){
    c.checked=sg('hpg-ck-'+c.dataset.k)==='1';
    c.onchange=function(){ss('hpg-ck-'+c.dataset.k,c.checked?'1':'0')};
  });
  [].forEach.call(document.querySelectorAll('[data-reset]'),function(b){
    b.onclick=function(){
      var p=b.dataset.reset+'-'+st.fam+'-'+st.fac+'-';
      [].forEach.call(document.querySelectorAll('input[data-k^="'+p+'"]'),function(c){c.checked=false;ss('hpg-ck-'+c.dataset.k,'0')});
    };
  });
}
function renderAll(){
  [].forEach.call(document.querySelectorAll('#fac button'),function(b){b.setAttribute('aria-pressed',b.dataset.f===st.fac)});
  document.getElementById('zep').checked=st.zep;
  document.getElementById('fam').value=st.fam;
  var F=fam();
  document.getElementById('title').textContent='🐾 '+F.n+' Training Guide';
  document.getElementById('subtitle').textContent='Hunter pets · '+actives(st.fam).map(function(s){return AB[s].n}).join(', ')+' · pet links open Wowhead Forever in a new tab';
  document.title=F.n+' Pet Training Guide';
  renderRules();
  renderPlan('planA','Plan A: every trip','Learn each skill as soon as its source and the pet level line up. Only the highest rank in each trip is shown, since skipping ranks is free.',buildA());
  renderPlan('planB','Plan B: one trip every 10 levels','Teach the highest rank the pet\'s level allows at each visit, using pets you can tame by then.',buildB());
  renderSpeed();
  renderRanks();
  renderFams();
  renderMore();
  bindChecks();
}
function setFam(id){st.fam=id;ss('hpg-fam',id);renderAll()}
function show(id){
  st.tab=id;ss('hpg-tab',id);
  [].forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-selected',b.dataset.p===id)});
  [].forEach.call(document.querySelectorAll('.panel'),function(p){p.classList.toggle('on',p.id===id)});
}
(function(){
  var t=sg('cat-theme');if(t)root.setAttribute('data-theme',t);
  document.getElementById('theme').onclick=function(){
    var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
    var n=dark?'light':'dark';root.setAttribute('data-theme',n);ss('cat-theme',n);
  };
  var sel=document.getElementById('fam');
  sel.innerHTML=Object.keys(DB.fams).sort(function(a,b){return DB.fams[a].n.localeCompare(DB.fams[b].n)}).map(function(id){return '<option value="'+id+'">'+esc(DB.fams[id].n)+'</option>'}).join('');
  sel.onchange=function(){setFam(this.value)};
  var fm=sg('hpg-fam');if(fm&&DB.fams[fm])st.fam=fm;
  var f=sg('hpg-fac');if(f==='E'||f==='K')st.fac=f;
  if(sg('hpg-zep')==='0')st.zep=false;
  st.lvl=parseInt(sg('hpg-lvl'),10)||0;
  [].forEach.call(document.querySelectorAll('#fac button'),function(b){b.onclick=function(){st.fac=b.dataset.f;ss('hpg-fac',st.fac);renderAll()}});
  document.getElementById('zep').onchange=function(){st.zep=this.checked;ss('hpg-zep',st.zep?'1':'0');renderAll()};
  [].forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){show(b.dataset.p)}});
  renderAll();
  var s=(location.hash||'').slice(1)||sg('hpg-tab')||'rules';
  if(!document.getElementById(s))s='rules';
  show(s);
})();
</script>
</body>
</html>
